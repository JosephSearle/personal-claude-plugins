name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate marketplace (pull request)
        if: github.event_name == 'pull_request'
        run: python scripts/validate.py --base origin/${{ github.base_ref }}

      - name: Validate marketplace (push)
        if: github.event_name == 'push'
        run: python scripts/validate.py
