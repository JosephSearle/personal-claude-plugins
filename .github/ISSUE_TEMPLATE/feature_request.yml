name: Feature request
description: Suggest a new skill, a new plugin, or a change to an existing one.
labels: [enhancement]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin does this affect?
      options:
        - core
        - dev-review
        - A new plugin
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't you currently do, and why does it matter? Evaluate this independently of any specific fix in mind.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd want to happen instead.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds, and why they fall short.
    validations:
      required: false
